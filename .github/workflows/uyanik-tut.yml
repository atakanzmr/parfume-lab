# Supabase ücretsiz planı bir hafta hiç istek gelmezse projeyi durdurur.
# Bu iş akışı üç günde bir küçük bir istek atarak projeyi uyanık tutar.
name: Supabase uyanık tut
on:
  schedule:
    - cron: '23 4 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Veritabanına dokun
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js | head -1)
          KEY=$(grep -o "key: *'[^']*'" config.js | sed "s/key: *'//; s/'$//")
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
