ACT.produce = async (d) => {
  await flushPending();
  const v = byId('formula_versions', d.v); const f = byId('formulas', v.formula_id);
  const c0 = calcLines(linesOf(v.id), v.conc);
  if (!(c0.T > 0)) return toast('Formülde miktar yok', 'bad');
  const sv = solvents(); const alc0 = defaultAlcohol();
  const actual = new Map(); let cur = null;
  const compute = (form) => {
    const val = readForm(form); const F = parseNum(val.final), C = parseNum(val.conc); const solv = val.solv ? mat(val.solv) : null;
    if (!(F > 0) || !(C > 0 && C <= 100)) return { err: 'Miktar ve konsantrasyon gir' };
    const K = F * C / 100, A = F - K, k = K / c0.T;
    if (A > 1e-9 && !solv) return { err: 'Seyreltici seç ya da konsantrasyonu %100 yap' };
    const lines = c0.rows.filter(r => r.a > 0).map(r => ({ key: r.l.id, m: r.m, planned: r.a * k }));
    if (A > 1e-9) lines.push({ key: 'solv', m: solv, planned: A });
    return { F, C, K, A, solv, lines };
  };
  // Tartılan kümülatif toplam: ilk boş satıra kadar terazinin göstereceği toplam
  const updCum = (form) => {
    if (!cur || cur.err) return;
    let cum = 0, pcum = 0, open = true;
    for (const l of cur.lines) {
      pcum += l.planned;
      const el = $(`.row[data-key="${l.key}"] [data-k="cum"]`, form); if (!el) continue;
      const raw = (actual.get(l.key) || '').trim(); const val = raw === '' ? NaN : parseNum(raw);
      if (!open || isNaN(val)) { open = false; el.textContent = '—'; el.className = ''; continue; }
      cum += val; el.textContent = fg(cum); el.className = Math.abs(cum - pcum) > 0.02 ? 'lowg' : '';
    }
  };
  const draw = (form) => {
    cur = compute(form); const pl = $('#plines', form), ps = $('#psum', form);
    if (cur.err) { pl.innerHTML = `<div class="empty">${esc(cur.err)}</div>`; ps.innerHTML = ''; return; }
    let pcum = 0, cost = 0;
    pl.innerHTML = cur.lines.map(l => {
      pcum += l.planned; cost += l.planned * avgCost(l.m.id);
      const st = stockOf(l.m.id); const low = st + 1e-6 < l.planned; const wh = weighHint(l.m, l.planned);
      return `<div class="row" data-key="${l.key}"><div class="main"><div class="t">${esc(matTitle(l.m))}</div>
        <div class="s num">plan ${fg(l.planned)} · plan toplam ${fg(pcum)}<br>tartılan toplam <span data-k="cum">—</span>${wh ? `<br><span class="lowg">${esc(wh.text)}</span>` : ''}${low ? `<br><span class="bad">kayıtlı stok ${fg(st)}</span>` : ''}</div>
        ${low ? countWidget(l.m.id) : ''}</div>
        <div class="amt"><input class="pin" inputmode="decimal" data-key="${l.key}" placeholder="${fnum(round2(l.planned), 2)}" value="${esc(actual.get(l.key) || '')}" aria-label="${esc(matTitle(l.m))}, tartılan gram" autocomplete="off"><span>g</span></div></div>`;
    }).join('');
    const short = shortages(cur.lines.map(l => ({ id: l.m.id, qty: l.planned })));
    ps.innerHTML = `<div class="calc"><div class="row"><span class="k">Konsantre</span><span class="v">${fg(cur.K)}</span></div>
      <div class="row"><span class="k">${cur.solv ? esc(shortOf(cur.solv)) : 'Seyreltici'}</span><span class="v">${fg(cur.A)}</span></div>
      <div class="row"><span class="k">Tahmini maliyet</span><span class="v">${ftl(cost)}</span></div></div>
      ${short.length ? `<div class="warn">${short.length} malzemede stok yetersiz. Şişede daha fazlası varsa satırdaki sayımla düzelt.</div>` : ''}`;
    updCum(form);
  };
  sheet({
    title: `Üret · ${vFull(v)}`, submit: 'Üretimi kaydet',
    body: `<div class="two">${fld('Parfüm miktarı (g)', numInp('final', 30))}${fld('Konsantrasyon (%)', numInp('conc', v.conc))}</div>
      <div class="two">${fld('Seyreltici', sel('solv', [['', '— Yok —'], ...sv.map(s => [s.id, `${shortOf(s)} · ${fg(stockOf(s.id))}`])], alc0 ? alc0.id : ''))}${fld('Dinlenme (gün)', inp('rest', 30, 'inputmode="numeric"'))}</div>
      ${fld('Tarih', dateInp('at'))}
      <div id="psum"></div>
      ${section('Tartım')}
      <div class="card list plan" id="plines"></div>
      <button type="button" class="btn full" id="pfill" style="margin-top:10px">Boşları planlananla doldur</button>
      <div style="height:12px"></div>
      ${fld('Not', area('notes', '', 'rows="2"'))}`,
    onMount: (form) => {
      form.addEventListener('input', (e) => {
        const t = e.target;
        if (t.classList.contains('cin')) return;
        if (t.classList.contains('pin')) { actual.set(t.dataset.key, t.value); t.classList.remove('bad'); updCum(form); return; }
        if (['final', 'conc'].includes(t.name)) { actual.clear(); draw(form); }
      });
      form.addEventListener('change', (e) => { if (e.target.name === 'solv') { actual.delete('solv'); draw(form); } });
      $('#pfill', form).addEventListener('click', () => {
        if (!cur || cur.err) return;
        for (const l of cur.lines) {
          if ((actual.get(l.key) || '').trim() !== '') continue;
          const val = fnum(round2(l.planned), 2); actual.set(l.key, val);
          const el = $(`.pin[data-key="${l.key}"]`, form); if (el) el.value = val;
        }
        updCum(form);
      });
      UI.sheetRedraw = () => draw(form);
      draw(form);
    },
    onSubmit: async (val, form) => {
      const r = compute(form); if (r.err) return fieldErr(form, 'final', r.err);
      const rest = val.rest === '' ? 0 : parseInt(val.rest, 10); if (!(rest >= 0)) return fieldErr(form, 'rest', 'Geçersiz');
      // Gerçekte tartılmamış miktar sessizce kaydedilmez
      const missing = r.lines.filter(l => (actual.get(l.key) || '').trim() === '');
      if (missing.length) {
        const el = $(`.pin[data-key="${missing[0].key}"]`, form); if (el) { el.classList.add('bad'); el.focus(); }
        toast(`${missing.length} satırın tartımı boş. Tartıp yaz ya da "Boşları planlananla doldur"a bas.`, 'bad'); return false;
      }
      const rows = [];
      for (const l of r.lines) {
        const a = parseNum(actual.get(l.key));
        if (isNaN(a) || a < 0) { const el = $(`.pin[data-key="${l.key}"]`, form); if (el) { el.classList.add('bad'); el.focus(); } toast('Tartım değerini kontrol et', 'bad'); return false; }
        rows.push({ ...l, actual: a });
      }
      const short = shortages(rows.map(x => ({ id: x.m.id, qty: x.actual })));
      if (short.length) { toast(`Stok yetersiz: ${short.map(x => matTitle(x.m)).join(', ')}`, 'bad'); return false; }
      const pid = uid(); const at = fromDayInput(val.at); const n = prodsOf(v.id).length + 1;
      const code = `${fCode(f)}-${vLabel(v)}-B${pad2(n)}`;
      const total = rows.reduce((s, x) => s + x.actual, 0);
      const ops = [ins('productions', { id: pid, version_id: v.id, code, final_g: r6(total), conc: r.C, solvent_id: r.solv ? r.solv.id : null, at, rest_days: rest, cancelled: false, notes: val.notes || null })];
      rows.forEach((x, i) => {
        ops.push(ins('production_lines', { production_id: pid, material_id: x.m.id, planned: r6(x.planned), actual: r6(x.actual), strength: strengthOf(x.m), unit_cost: r6(avgCost(x.m.id)), pos: i }));
        if (x.actual > 0) ops.push(mv(x.m.id, -x.actual, 'production', { ref_kind: 'production', ref_id: pid, note: code, at }));
      });
      if (v.status === 'draft') ops.push(upd('formula_versions', v.id, { status: 'locked' }));
      if (!(await commit(ops))) return false;
      go('p/' + pid); toast(`${code} kaydedildi`);
    }
  });
};

  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(() => { /* vazgeçildi */ }); return; }
  } catch (e) { /* indirme yoluna geç */ }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
};
ACT.logout = async () => {
  if (!(await ask('Çıkış yap', 'Bu cihazdaki oturum kapanacak. Veriler bulutta kalır.', 'Çıkış yap', true))) return;
  await flushPending(); await Remote.signOut(); Cache.clear(); UI.started = false; loginScreen();
};
ACT.resetPreview = async () => {
  if (!(await ask('Önizlemeyi sıfırla', 'Önizlemede girdiğin her şey silinir ve başlangıç verisi geri gelir.', 'Sıfırla', true))) return;
  Local.reset(); DB = Local.load(); invalidate(); go('stok'); toast('Önizleme sıfırlandı');
};

/* ================= Parfüm Lab · açılış ================= */
ACT.reload = () => location.reload();

function start() {
  UI.started = true; UI.stack = [];
  if (HASH) UI.route = parseHash();
  render(true);
  Intro.ready();
}
function splash() {
  $('#tabs').innerHTML = '';
  $('#view').innerHTML = '';
}
function fatal(msg) {
  $('#tabs').innerHTML = '';
  Intro.ready();
  $('#view').innerHTML = `<div class="gate">${LOGO_TILE(64)}<h1>Parfüm Lab</h1><p>${esc(msg)}</p><button class="btn primary" data-a="reload">Tekrar dene</button></div>`;
}
function loginScreen(msg) {
  closeSheet();
  Intro.ready();
  $('#tabs').innerHTML = '';
  $('#view').innerHTML = `<div class="gate">${LOGO_TILE(64)}<h1>Parfüm Lab</h1><p>${esc(msg || 'Giriş yap')}</p>
    <form id="lf" novalidate>
      ${fld('E-posta', inp('email', '', 'type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"'))}
      ${fld('Şifre', inp('password', '', 'type="password" autocomplete="current-password"'))}
      <div class="msg bad" id="lmsg" style="min-height:20px;font-size:14px"></div>
      <button class="btn primary" type="submit" id="lbtn">Giriş yap</button>
    </form></div>`;
  $('#lf').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = readForm(e.target); const b = $('#lbtn');
    if (!f.email || !f.password) { $('#lmsg').textContent = 'E-posta ve şifre gir'; return; }
    b.disabled = true; $('#lmsg').textContent = '';
    try {
      await Remote.signIn(f.email, f.password);
      UI.email = f.email;
      await loadRemote(false);
    } catch (err) {
      $('#lmsg').textContent = /invalid login|invalid_credentials|Invalid/i.test(err.message || '') ? 'E-posta ya da şifre hatalı' : errText(err);
    } finally { if (b.isConnected) b.disabled = false; }
  });
}

const editingInView = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#view').contains(a); };

async function loadRemote(isRefresh) {
  if (!UI.started && !isRefresh) {
    const cached = Cache.read();
    if (cached) { DB = cached; invalidate(); start(); } else splash();
  }
  try {
    const fresh = await Remote.load();
    DB = fresh; invalidate(); Cache.write(); UI.lastLoad = Date.now();
    if (!UI.started) start(); else if (!editingInView() && !$('#sheet').classList.contains('open')) rerender();
  } catch (e) {
    console.error(e);
    const m = (e && e.message) || '';
    if (/JWT|token|401|not authenticated/i.test(m)) { UI.started = false; return loginScreen('Oturum sona erdi, yeniden giriş yap'); }
    if (!UI.started) fatal('Veriler yüklenemedi. İnternet bağlantını kontrol et.');
    else toast('Veriler yenilenemedi', 'bad');
  }
}

async function boot() {
  HASH = !window.PL_PREVIEW;
  if (window.PL_PREVIEW) {
    MODE = 'local'; DB = Local.load(); invalidate(); start(); return;
  }
  window.addEventListener('popstate', () => { if (UI.started) onPopState(); });
  if (!CFG) return fatal('Yapılandırma dosyası (config.js) bulunamadı.');
  if (!window.supabase) return fatal('Bağlantı kitaplığı yüklenemedi. İnternet bağlantını kontrol et.');
  MODE = 'remote';
  Remote.init();
  splash();
  let sess = null;
  try { sess = await Remote.session(); } catch (e) { /* oturum yok sayılır */ }
  if (!sess) return loginScreen();
  UI.email = sess.user && sess.user.email;
  Remote.sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && UI.started) { UI.started = false; loginScreen(); } });
  await loadRemote(false);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flushPending(); return; }
  if (MODE === 'remote' && UI.started && Date.now() - UI.lastLoad > 30000) loadRemote(true);
});

if (!window.PL_PREVIEW && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* çevrimdışı önbellek olmadan da çalışır */ }); });
}
boot();

</script>
